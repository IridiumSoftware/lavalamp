# LavaLamp Julia test suite — runs on every push to master and on PRs.
#
# Lockfile discipline (per CLAUDE.md package-management rule):
#   julia-buildpkg uses Pkg.instantiate() which installs from the
#   committed Manifest.toml. CI verifies that a clean checkout +
#   lockfile install builds and that the full assertion count passes.
#
# Julia version: 1.12 to match the dev environment. Project.toml
# [compat] declares julia = "1.10" so older versions should also
# work; expand the matrix when there's a reason to support them.
#
# Platform matrix: ubuntu-latest exercises the LL-024 Phase 1
# Linux readers (sysfs/procfs) on every push; macos-latest
# exercises the LL-024 Phase 2a + 2b macOS readers (sysctl /
# pmset / ioreg shell-out + AppleSMC IOKit FFI for CPU-die
# thermal). Windows remains scaffold-error pending Phase 3.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: src/julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: src/julia
      - name: Verify demo against canonical output
        run: bash src/julia/demo/verify_demo.sh

  tpm2-binding:
    name: LL-044 TPM2 binding (swtpm + ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install swtpm + tpm2-tools + Python crypto
        run: |
          sudo apt-get update
          sudo apt-get install -y swtpm swtpm-tools tpm2-tools \
            libtss2-tcti-swtpm0 python3-cryptography
          which swtpm tpm2_getcap tpm2_createprimary tpm2_sign

      - name: Start swtpm (TCP, port 2321/2322)
        run: |
          mkdir -p /tmp/swtpm-state
          swtpm socket --tpm2 \
            --tpmstate dir=/tmp/swtpm-state \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags startup-clear \
            --daemon
          sleep 2
          # Confirm swtpm is reachable via the swtpm TCTI.
          TPM2TOOLS_TCTI="swtpm:host=127.0.0.1,port=2321" tpm2_getcap properties-fixed | head -10

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: src/julia

      - name: Pre-warm Julia + LavaLamp precompile
        env:
          TPM2TOOLS_TCTI: "swtpm:host=127.0.0.1,port=2321"
        run: |
          # The daemon's first launch triggers heavy precompile of
          # LavaLamp + ChaosGuard + RealSensors + DiffEq deps,
          # which can take 60-120s on a cold runner. Pre-warm here
          # so the daemon's subsequent launch is fast and the
          # IPC-init timeout window (below) is realistic.
          julia --project=src/julia -e '
            using Pkg; Pkg.precompile()
            using LavaLamp
            println("LavaLamp precompiled and loadable.")
          '

      - name: Run daemon against swtpm + smoke-test v4 IPC
        env:
          TPM2TOOLS_TCTI: "swtpm:host=127.0.0.1,port=2321"
        run: |
          set -x
          # Confirm the daemon will see tpm2_available() == true.
          tpm2_getcap properties-fixed > /dev/null
          echo "swtpm reachable; tpm2_available() should return true"

          # Start the daemon in background.
          mkdir -p ~/.lavalamp
          rm -f ~/.lavalamp/verify.sock ~/.lavalamp/verify.pub

          julia --project=src/julia \
            src/julia/daemon/lavalamp_daemon.jl \
            --heartbeat-cadence 1 > /tmp/daemon.log 2>&1 &
          DAEMON_PID=$!
          echo "Daemon PID: $DAEMON_PID"

          # Wait for the daemon to write verify.pub (signals
          # init complete) — up to 120s. Even with pre-warm, the
          # daemon's setup_envelope + first verify cycle on a
          # fresh ~/.lavalamp can take a while.
          set +e
          ready=0
          for i in $(seq 1 120); do
            if [ -f ~/.lavalamp/verify.pub ] \
               && [ -S ~/.lavalamp/verify.sock ]; then
              echo "Daemon ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "FAIL: daemon never wrote verify.pub + verify.sock"
            echo "--- daemon log ---"
            cat /tmp/daemon.log || echo "(daemon log empty)"
            kill $DAEMON_PID 2>/dev/null || true
            wait $DAEMON_PID 2>/dev/null || true
            exit 1
          fi

          pub_size=$(wc -c < ~/.lavalamp/verify.pub)
          if [ "$pub_size" != "33" ]; then
            echo "FAIL: verify.pub size $pub_size, expected 33"
            echo "--- daemon log ---"
            cat /tmp/daemon.log
            kill $DAEMON_PID 2>/dev/null || true
            wait $DAEMON_PID 2>/dev/null || true
            exit 1
          fi

          # Confirm daemon took the LL-044 TPM2-bound path
          # (and not the LL-043 software-key fallback).
          if grep -q "LL-044 TPM2-bound" /tmp/daemon.log; then
            echo "PASS: daemon reports LL-044 TPM2-bound path active"
          else
            echo "FAIL: daemon banner does not mention LL-044 TPM2"
            echo "--- daemon log ---"
            cat /tmp/daemon.log
            kill $DAEMON_PID 2>/dev/null || true
            wait $DAEMON_PID 2>/dev/null || true
            exit 1
          fi
          set -e

          # End-to-end v4 IPC smoke against the running daemon.
          python3 test/tpm2_ipc_smoke.py

          # Stop daemon (atexit triggers tpm2_evictcontrol cleanup).
          kill -INT $DAEMON_PID
          wait $DAEMON_PID 2>/dev/null || true

          echo "--- daemon log (tail) ---"
          tail -60 /tmp/daemon.log
