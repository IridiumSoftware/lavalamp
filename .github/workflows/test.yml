# LavaLamp Julia test suite — runs on every push to master and on PRs.
# The LL-044 swtpm CI job was removed at v0.0.90 (see footer comment
# in this file for the rationale and the two open paths to revive it).
#
# Lockfile discipline (per CLAUDE.md package-management rule):
#   julia-buildpkg uses Pkg.instantiate() which installs from the
#   committed Manifest.toml. CI verifies that a clean checkout +
#   lockfile install builds and that the full assertion count passes.
#
# Julia version: 1.12 to match the dev environment. Project.toml
# [compat] declares julia = "1.10" so older versions should also
# work; expand the matrix when there's a reason to support them.
#
# Platform matrix: ubuntu-latest exercises the LL-024 Phase 1
# Linux readers (sysfs/procfs) on every push; macos-latest
# exercises the LL-024 Phase 2a + 2b macOS readers (sysctl /
# pmset / ioreg shell-out + AppleSMC IOKit FFI for CPU-die
# thermal). Windows remains scaffold-error pending Phase 3.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: src/julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: src/julia
      - name: Verify demo against canonical output
        run: bash src/julia/demo/verify_demo.sh

# ─── LL-044 TPM2 binding CI — REMOVED at v0.0.90 (2026-05-11) ────────
#
# Three iterations of an `swtpm + tpm2-tools` CI job at this slot
# (commits aef4da5 / 85f4ec9 / 2f602ab / 3958fdb) hit consistent
# blockers and were dropped:
#
#   iter 1 (aef4da5): 30s daemon-init wait too short for Julia
#     cold-cache precompile (~14 min).
#   iter 2 (85f4ec9): redundant pre-warm Pkg.precompile() ran
#     for 13+ min before hitting the 15-min job timeout.
#   iter 3 (3958fdb): pre-warm dropped, daemon-init wait bumped
#     to 1500s + job timeout to 45 min. Daemon successfully
#     started at 903s but tpm2_load failed with
#     `Esys_Load(0x902) - tpm:warn(2.0): out of memory for
#     object contexts`. swtpm without tpm2-abrmd does not
#     auto-flush transient handles between separate
#     tpm2-tools process invocations; the daemon's
#     tpm2_init_signing_key sequence (createprimary -> create
#     -> load -> evictcontrol) exhausts the transient-slot
#     pool by step 3.
#
# Cleanly fixing this requires either:
#   (a) Adding `tpm2_flushcontext -t` calls between each
#       tpm2-tools step in the daemon's TPM2 init path. ~10
#       LOC of daemon code; harmless on hardware TPMs;
#       solves the swtpm slot-exhaustion problem.
#   (b) Installing + starting tpm2-abrmd alongside swtpm in
#       CI, and switching TPM2TOOLS_TCTI to a tabrmd-layered
#       config. ~40 LOC of CI bash + a stable abrmd dbus setup.
#
# Neither was pursued for v0.0.90. LL-044 remains :tested at the
# entry level (fallback dispatch validated) + :argued at the
# TPM2-path-internal level (TPM2 code paths shipped but not
# CI-validated). Promotion to fully :tested requires either of
# the above fixes + a real-Linux-TPM deployment session OR a
# clean swtpm+abrmd CI iteration.
#
# The local smoke-test client (`test/tpm2_ipc_smoke.py`) is
# kept in the tree — useful for ad-hoc validation against a
# real Linux TPM 2.0 deployment.
