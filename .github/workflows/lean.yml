# LavaLamp Lean 4 build — runs on every push to master and on PRs.
#
# Lockfile discipline (per CLAUDE.md package-management rule):
#   leanprover/lean-action reads `src/lean4/lean-toolchain` for the
#   pinned Lean version and `src/lean4/lake-manifest.json` for the
#   pinned dependency manifest (empty packages list at scaffold
#   tier). CI verifies that a clean checkout + lockfile install
#   builds.
#
# Scaffold tier (0.0.36+): the package builds with no theorems —
#   only `def hello` smoke + `LavaLamp/Theorems.lean` round-3
#   placeholder. The CI baseline is "lake build clean."
#
# Mathlib integration (0.0.47+): `lean-action` invokes
#   `lake exe cache get` automatically before `lake build`,
#   which downloads Mathlib's prebuilt `.olean` cache (~8k
#   files). First-build-on-fresh-runner is slower than the
#   pre-Mathlib scaffold — timeout bumped 15 → 60 to absorb
#   the cache download window.
#
# When proofs land (round-3+): `sorry`-stubs still build clean;
#   real proofs without `sorry` are what CI starts catching as
#   correctness checks. Same workflow, deeper meaning.

name: Lean

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lake build (Lean 4 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build LavaLamp Lean library
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: src/lean4
